# Local development stack (TECHNICAL_DOC §8).
#   docker compose up --build   -> postgres, redis, api (migrate-on-start), worker, web, admin
# Secrets come from the shell environment or root .env; dev-only defaults are
# provided so `docker compose up` works with zero configuration.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: profy
      POSTGRES_PASSWORD: profy
      POSTGRES_DB: profy
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profy -d profy"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    command: ["java", "-jar", "/home/appuser/app.jar"]
    environment:
      PORT: 8080
      SPRING_PROFILES_ACTIVE: local
      DATABASE_URL: jdbc:postgresql://postgres:5432/profy
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me}
      PROFY_AI_ENCRYPTION_KEY: ${PROFY_AI_ENCRYPTION_KEY:-}
      # AI — any OpenAI-compatible provider (OpenRouter, OpenAI, Gemini, Groq, Together, etc.)
      AI_BASE_URL: ${AI_BASE_URL:-https://openrouter.ai/api/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-openai/gpt-4o-mini}
      AI_FREE_MSGS_PER_DAY: ${AI_FREE_MSGS_PER_DAY:-20}
      AI_PREMIUM_MSGS_PER_DAY: ${AI_PREMIUM_MSGS_PER_DAY:-200}
      # Stripe (international)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # MarzPay (local mobile money — UG/KE)
      MARZPAY_BASE_URL: ${MARZPAY_BASE_URL:-https://wallet.wearemarz.com/api/v1}
      MARZPAY_API_KEY: ${MARZPAY_API_KEY:-}
      MARZPAY_API_SECRET: ${MARZPAY_API_SECRET:-}
      MARZPAY_CALLBACK_URL: ${MARZPAY_CALLBACK_URL:-}
      # Other
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3002,http://localhost:3003}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-http://localhost:3003}
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: ["java", "-jar", "/home/appuser/app.jar", "--spring.profiles.active=worker"]
    environment:
      SPRING_PROFILES_ACTIVE: worker
      DATABASE_URL: jdbc:postgresql://postgres:5432/profy
      REDIS_URL: redis://redis:6379/0
      # AI
      AI_BASE_URL: ${AI_BASE_URL:-https://openrouter.ai/api/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-openai/gpt-4o-mini}
      # Stripe
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      # Auto video curation (YouTube Data API v3)
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      # MarzPay
      MARZPAY_BASE_URL: ${MARZPAY_BASE_URL:-https://wallet.wearemarz.com/api/v1}
      MARZPAY_API_KEY: ${MARZPAY_API_KEY:-}
      MARZPAY_API_SECRET: ${MARZPAY_API_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    ports:
      - "3002:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:8080
    depends_on:
      - api

  admin:
    build:
      context: ./apps/admin
    ports:
      - "3003:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:8080
    depends_on:
      - api

volumes:
  postgres_data:
