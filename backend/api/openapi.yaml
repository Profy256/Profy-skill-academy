  # ---------------------------------------------------------------- certificates
  /api/v1/courses/{slug}/final-test:
    get:
      tags: [certificates]
      summary: Final-test state for a course (eligibility, pricing, questions)
      description: |
        Returns everything the Certificate tab needs. `questions` never carries
        `answerIndex` — the answer key stays on the server. `readyToAttempt` is
        true only when the learner holds their free attempt (progress >= threshold,
        no prior attempt) or an unused paid credit.
      operationId: getFinalTestState
      security:
        - consumerAuth: []
      parameters:
        - $ref: "#/components/parameters/CourseSlug"
      responses:
        "200":
          description: Current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalTestState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/courses/{slug}/final-test/attempts:
    post:
      tags: [certificates]
      summary: Submit answers — graded server-side
      description: |
        Attempt #1 is free when progress >= `freeAttemptProgressPercent`; any
        later attempt consumes an unused credit, otherwise the API answers
        `402 payment_required`. Passing (>= pass percent) with `confirmName`
        issues the credential(s).
      operationId: submitFinalTest
      security:
        - consumerAuth: []
      parameters:
        - $ref: "#/components/parameters/CourseSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitFinalTestRequest"
      responses:
        "200":
          description: Graded result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitFinalTestResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/billing/cert-test/checkout/stripe:
    post:
      tags: [certificates, billing]
      summary: Buy a retake credit with Stripe (one-off, amount from settings)
      operationId: certTestCheckoutStripe
      security:
        - consumerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertCheckoutRequest"
      responses:
        "200":
          description: Checkout session URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertCheckoutResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/billing/cert-test/checkout/marzpay:
    post:
      tags: [certificates, billing]
      summary: Buy a retake credit with MarzPay (mobile money, amount from settings)
      operationId: certTestCheckoutMarzPay
      security:
        - consumerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertCheckoutRequest"
      responses:
        "200":
          description: Collection reference (poll `/billing/cert-test/status`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertCheckoutResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/billing/cert-test/status:
    get:
      tags: [certificates, billing]
      summary: Confirm a credit purchase without waiting for a webhook
      operationId: certTestCreditStatus
      security:
        - consumerAuth: []
      parameters:
        - name: provider
          in: query
          required: true
          schema:
            type: string
            enum: [stripe, marzpay]
        - name: reference
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Credit status (`pending` | `unused` | `consumed` | `failed`)
          content:
