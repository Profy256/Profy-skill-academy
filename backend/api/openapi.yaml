        - adminAuth: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalTestAuthoringInput"
      responses:
        "200":
          description: Saved test
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalTestAuthoring"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"


components:
  securitySchemes:
    consumerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Consumer JWT with audience `consumer` (15 min).
    adminAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Admin JWT with audience `admin` (15 min). Never interchangeable with consumer tokens.

  parameters:
    CourseSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
    CourseId:
      name: courseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CertCode:
      name: code
      in: path
      required: true
      description: Uppercase, ambiguity-free credential code
      schema:
        type: string
    DefinitionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PostSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
    CertificateId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PostId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageNumber:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    PageSize:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 12

  responses:
    Unauthorized:
      description: Missing/invalid/expired token, or token audience mismatch
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found (or invisible to this audience)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Invalid request body/parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: "Too many requests (auth: IP-based; AI chat: per-user daily)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AIUnavailable:
      description: "AI Teacher degraded - lesson content stays fully usable"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PaymentRequired:
      description: "Paid attempt required (free attempt already used, or progress below threshold)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine code, e.g. ai_unavailable, rate_limited.
            message:
              type: string

    Health:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        service:
          type: string
        version:
          type: string
        uptime_seconds:
          type: integer
        checks:
          type: object
          properties:
            postgres:
              type: boolean
            redis:
              type: boolean

    # ---------------------------------------------------------------- auth
    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string
          minLength: 1
        device:
          type: string
          enum: [mobile, web]
          default: web

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        device:
          type: string
          enum: [mobile, web]
          default: web

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Access token lifetime in seconds (900).

    # ------------------------------------------------------------- taxonomy
    TaxonomyNode:
      type: object
      properties:
        id:
          type: string
          format: uuid
        parent_id:
          type: [string, "null"]
          format: uuid
        node_type:
          type: string
          enum: [category, subcategory, course]
        name:
          type: string
        slug:
          type: string
        description:
          type: [string, "null"]
        icon:
          type: [string, "null"]
        phase:
          type: integer
          enum: [1, 2]
        is_active:
          type: boolean
        sort_order:
          type: integer
        depth:
          type: integer
        children:
          type: array
          items:
            $ref: "#/components/schemas/TaxonomyNode"

    NodeDetail:
      allOf:
        - $ref: "#/components/schemas/TaxonomyNode"
        - type: object
          properties:
            breadcrumb:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  slug:
                    type: string

    TaxonomyCreateRequest:
      type: object
      required: [node_type, name, slug]
      properties:
        parent_id:
          type: [string, "null"]
          format: uuid
        node_type:
          type: string
          enum: [category, subcategory, course]
        name:
          type: string
          minLength: 1
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        description:
          type: string
        icon:
          type: string
        phase:
          type: integer
          enum: [1, 2]
          default: 1
        is_active:
          type: boolean
          default: true
        sort_order:
          type: integer
          default: 0

    TaxonomyUpdateRequest:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        description:
          type: [string, "null"]
        icon:
          type: [string, "null"]
        phase:
          type: integer
          enum: [1, 2]
        is_active:
          type: boolean
        sort_order:
          type: integer

    ReorderRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, sort_order]
            properties:
              id:
                type: string
                format: uuid
              sort_order:
                type: integer

    # -------------------------------------------------------------- content
    CourseSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: [string, "null"]
        icon:
          type: [string, "null"]
        lesson_count:
          type: integer
        levels:
          type: array
          items:
            type: string
            enum: [beginner, intermediate, advanced]

    CourseDetail:
      allOf:
        - $ref: "#/components/schemas/CourseSummary"
        - type: object
          properties:
            lessons:
              type: array
              items:
                $ref: "#/components/schemas/LessonSummary"

    LessonSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        level:
          type: [string, "null"]
          enum: [beginner, intermediate, advanced]
        sort_order:
          type: integer

    LessonDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        description:
          type: [string, "null"]
        explanation:
          type: [string, "null"]
        objectives:
          type: array
          items:
            type: string
        examples:
          type: array
          items:
            type: string
        exercises:
          type: array
          items:
            type: string
        quizzes:
          type: array
          items:
            $ref: "#/components/schemas/Quiz"
        level:
          type: [string, "null"]
          enum: [beginner, intermediate, advanced]
        video:
          $ref: "#/components/schemas/LessonVideo"
        alternates:
          type: array
          items:
            $ref: "#/components/schemas/LessonVideo"

    LessonVideo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        youtube_video_id:
          type: string
          pattern: "^[A-Za-z0-9_-]{11}$"
        title:
          type: string
        channel:
          type: [string, "null"]
        is_primary:
          type: boolean

    Quiz:
      type: object
      required: [question, options, answer_index]
      properties:
        question:
          type: string
        options:
          type: array
          minItems: 2
          items:
            type: string
        answer_index:
          type: integer
          minimum: 0

    # ------------------------------------------------------------ discovery
    SearchResult:
      type: object
      properties:
        type:
          type: string
          enum: [course, lesson]
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: [string, "null"]
        course_slug:
          type: [string, "null"]
        lesson_count:
          type: [integer, "null"]

    SearchResults:
      type: object
      properties:
        query:
          type: string
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
        next_cursor:
          type: [string, "null"]

    FeaturedHome:
      type: object
      properties:
        featured:
          type: array
          items:
            $ref: "#/components/schemas/CourseSummary"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/TaxonomyNode"

    AdPlacement:
      type: object
      properties:
        placement_id:
          type: string
          enum: [home_banner, lesson_banner, lesson_interstitial, library_banner]
        enabled:
          type: boolean
        frequency:
          type: integer
          description: Show roughly once every N screens/sessions.

    ConfigResponse:
      type: object
      properties:
        ads:
          type: object
          properties:
            enabled:
              type: boolean
            placements:
              type: array
              items:
                $ref: "#/components/schemas/AdPlacement"
        app:
          type: object
          properties:
            min_version:
              type: [string, "null"]
            force_update:
              type: boolean
              default: false

    # ------------------------------------------------------------------- AI
    AIChatRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1

    AIChatResponse:
      type: object
      required: [reply]
      properties:
        reply:
          type: string

    ChatMessage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        created_at:
          type: string
          format: date-time

    ChatHistory:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"

    # ------------------------------------------------------------- progress
    ProgressRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [in_progress, completed]

    ContinueLearningItem:
      type: object
      properties:
        lesson:
          $ref: "#/components/schemas/LessonSummary"
        course_slug:
          type: string
        course_name:
          type: string
        status:
          type: string
          enum: [in_progress, completed]
        updated_at:
          type: string
          format: date-time

    ContinueLearningResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContinueLearningItem"

    Bookmark:
      type: object
      properties:
        lesson_id:
          type: string
          format: uuid
        lesson_title:
          type: string
        course_slug:
          type: string
        course_name:
          type: string
        created_at:
          type: string
          format: date-time

    BookmarkList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Bookmark"

    QuizAttemptRequest:
      type: object
      required: [score, total]
      properties:
        score:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 1

    QuizAttemptResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        score:
          type: integer
        total:
          type: integer
        passed:
          type: boolean
        attempt_number:
          type: integer

    ProfileStats:
      type: object
      properties:
        courses_completed:
          type: integer
        lessons_completed:
          type: integer
        lessons_in_progress:
          type: integer
        bookmarks_count:
          type: integer
        quizzes_taken:
          type: integer
        avg_quiz_score:
          type: [number, "null"]

    # -------------------------------------------------------------- billing
    Entitlement:
      type: object
      properties:
        is_premium:
          type: boolean
        plan:
          type: [string, "null"]
          enum: [monthly, yearly]
        current_period_end:
          type: [string, "null"]
          format: date-time

    CheckoutRequest:
      type: object
      required: [plan]
      properties:
        plan:
          type: string
          enum: [monthly, yearly]
        success_url:
          type: string
        cancel_url:
          type: string

    CheckoutResponse:
      type: object
      properties:
        checkout_url:
          type: string
        session_id:
          type: string

    # ----------------------------------------------------------- admin auth
    AdminLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AdminUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [admin]

    AdminLoginResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
        admin_user:
          $ref: "#/components/schemas/AdminUser"

    # ------------------------------------------------------- admin content
    LessonInput:
      type: object
      required: [node_id, title, slug]
      properties:
        node_id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        description:
          type: string
        explanation:
          type: string
        objectives:
          type: array
          items:
            type: string
        examples:
          type: array
          items:
            type: string
        exercises:
          type: array
          items:
            type: string
        quizzes:
          type: array
          items:
            $ref: "#/components/schemas/Quiz"
        level:
          type: [string, "null"]
          enum: [beginner, intermediate, advanced]
        status:
          type: string
          enum: [draft, published]
          default: draft
        sort_order:
          type: integer
          default: 0

    AdminLesson:
      type: object
      properties:
        id:
          type: string
          format: uuid
        node_id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        description:
          type: [string, "null"]
        explanation:
          type: [string, "null"]
        objectives:
          type: array
          items:
            type: string
        examples:
          type: array
          items:
            type: string
        exercises:
          type: array
          items:
            type: string
        quizzes:
          type: array
          items:
            $ref: "#/components/schemas/Quiz"
        level:
          type: [string, "null"]
          enum: [beginner, intermediate, advanced]
        status:
          type: string
          enum: [draft, published]
        sort_order:
          type: integer
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        videos:
          type: array
          items:
            $ref: "#/components/schemas/VideoCandidate"

    VideoInput:
      type: object
      properties:
        youtube_url:
          type: string
          description: Full YouTube URL; the ID is extracted and validated server-side.
        youtube_video_id:
          type: string
          pattern: "^[A-Za-z0-9_-]{11}$"
        title:
          type: string
        channel:
          type: string
        is_primary:
          type: boolean
        curator_status:
          type: string
          enum: [pending, approved, flagged, unavailable]
        date_reviewed:
          type: [string, "null"]
          format: date
        notes:
          type: string

    AutoCurationSettings:
      type: object
      description: Runtime state of automatic video curation.
      properties:
        enabled:
          type: boolean
          description: Admin toggle — when false, all curation paths no-op.
        keyConfigured:
          type: boolean
          description: Whether YOUTUBE_API_KEY is present in the environment.

    UncoveredLessonItem:
      type: object
      description: |
        Published lesson with no video rows at all — auto-curation found nothing (or is
        disabled). Shown in the admin Coverage report as needing manual curation.
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        courseName:
          type: string
          description: Name of the parent course (taxonomy node).
        created_at:
          type: [string, "null"]
          format: date-time

    VideoCandidate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        lesson_id:
          type: string
          format: uuid
        youtube_video_id:
          type: string
        title:
          type: string
        channel:
          type: [string, "null"]
        is_primary:
          type: boolean
        source:
          type: string
          enum: [curated, auto]
          description: |
            `curated` = admin-provided (always takes priority).
            `auto` = auto-sourced fallback from YouTube Data API search for lessons
            without a curated video. One auto video per lesson; created with
            `curator_status=pending` and a nullable `added_by`.
    ReviewVideoItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        lesson_id:
          type: string
          format: uuid
        lesson_title:
          type: string
        youtube_video_id:
          type: string
        title:
          type: string
        channel:
          type: [string, "null"]
        curator_status:
          type: string
          enum: [flagged, unavailable]
        notes:
          type: [string, "null"]
        last_checked_at:
          type: [string, "null"]
          format: date-time
        is_available:
          type: [boolean, "null"]

    AuditLogEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        admin_user_id:
          type: string
          format: uuid
        admin_email:
          type: string
        action:
          type: string
        entity:
          type: string
        entity_id:
          type: [string, "null"]
          format: uuid
        payload:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    AuditLogPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogEntry"
        next_cursor:
          type: [string, "null"]

    # -------------------------------------------------------- certificates
    FinalTestState:
      type: object
      properties:
        courseId:
          type: string
          format: uuid
        courseSlug:
          type: string
        courseName:
          type: string
        progressPercent:
          type: integer
        progressThresholdPercent:
          type: integer
          description: Progress required for the free attempt (admin-editable, default 50)
        attemptsUsed:
          type: integer
        freeAttemptAvailable:
          type: boolean
        creditsAvailable:
          type: integer
          description: Unused paid retake credits held for this course
        readyToAttempt:
          type: boolean
        featureEnabled:
          type: boolean
          description: Certificates globally switched on by an admin
        testTitle:
          type: string
        testInstructions:
          type: string
        passPercent:
          type: integer
        pricing:
          $ref: "#/components/schemas/CertPricing"
        questions:
          type: array
          description: Question + options only; `answerIndex` never leaves the server
          items:
            $ref: "#/components/schemas/FinalTestQuestion"
        certificate:
          oneOf:
            - $ref: "#/components/schemas/Certificate"
            - type: "null"
        certificates:
          type: array
          items:
            $ref: "#/components/schemas/Certificate"
        lessonCompleted:
          type: integer
        lessonTotal:
          type: integer

    CertPricing:
      type: object
      properties:
        stripeAmountCents:
          type: integer
        stripeCurrency:
          type: string
          examples: [usd]
        marzpayAmountUgx:
          type: integer
        marzpayCurrency:
          type: string
          examples: [UGX]

    FinalTestQuestion:
      type: object
      properties:
        index:
          type: integer
        question:
          type: string
        options:
          type: array
          items:
            type: string

    SubmitFinalTestRequest:
      type: object
      required: [answers, confirmName]
      properties:
        answers:
          type: array
          items:
            type: integer
        confirmName:
          type: boolean
          description: Learner confirms the name printed on the certificate
        recipientName:
          type: string
          description: Optional printed-name override

    SubmitFinalTestResponse:
      type: object
      properties:
        score:
          type: integer
        total:
          type: integer
        percent:
          type: integer
        passed:
          type: boolean
        attemptNumber:
          type: integer
        freeAttempt:
          type: boolean
        creditsRemaining:
          type: integer
        certificates:
          type: array
          items:
            $ref: "#/components/schemas/Certificate"

    Certificate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        verifyUrl:
          type: string
        courseId:
          type: string
          format: uuid
        courseSlug:
          type: string
        courseName:
          type: string
        definitionId:
          type: [string, "null"]
          format: uuid
        definitionName:
          type: string
        recipientName:
          type: string
        score:
          type: [integer, "null"]
        total:
          type: [integer, "null"]
        passPercent:
          type: integer
        issuedAt:
          type: string
          format: date-time
        revokedAt:
          type: [string, "null"]
          format: date-time
        identityVerifiedAt:
          type: [string, "null"]
          format: date-time
        emailSentAt:
          type: [string, "null"]
          format: date-time
        revoked:
          type: boolean

    CertificateDefinition:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        shortName:
          type: [string, "null"]
        description:
          type: [string, "null"]
        badgeColor:
          type: [string, "null"]
        courseId:
          type: [string, "null"]
          format: uuid
        courseSlug:
          type: [string, "null"]
        courseName:
          type: [string, "null"]
        requireFinalTest:
          type: boolean
        requireCourseComplete:
          type: boolean
        passPercent:
          type: integer
        minProgressPercent:
          type: integer
        autoIssue:
          type: boolean
        certHeadingOverride:
          type: [string, "null"]
        certIntroOverride:
          type: [string, "null"]
        certAchievedOverride:
          type: [string, "null"]
        accentColorOverride:
          type: [string, "null"]
        isEnabled:
          type: boolean
        sortOrder:
          type: integer
        issuedCount:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CertificateDefinitionInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        slug:
          type: string
        shortName:
          type: string
        description:
          type: string
        badgeColor:
          type: string
        courseNodeId:
          type: [string, "null"]
          format: uuid
        requireFinalTest:
          type: boolean
        requireCourseComplete:
          type: boolean
        passPercent:
          type: integer
          minimum: 1
          maximum: 100
        minProgressPercent:
          type: integer
          minimum: 0
          maximum: 100
        autoIssue:
          type: boolean
        certHeadingOverride:
          type: [string, "null"]
        certIntroOverride:
          type: [string, "null"]
        certAchievedOverride:
          type: [string, "null"]
        accentColorOverride:
          type: [string, "null"]
        isEnabled:
          type: boolean
        sortOrder:
          type: integer

    IssuedCertificate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        verifyUrl:
          type: string
        recipientName:
          type: string
        userEmail:
          type: [string, "null"]
        courseName:
          type: string
        definitionName:
          type: string
        score:
          type: [integer, "null"]
        total:
          type: [integer, "null"]
        passPercent:
          type: integer
        issuedAt:
          type: string
          format: date-time
        revokedAt:
          type: [string, "null"]
          format: date-time
        emailError:
          type: [string, "null"]
        revoked:
          type: boolean

    IssuedCertificatePage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/IssuedCertificate"
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        number:
          type: integer
        size:
          type: integer

    CertificateVerifyResult:
      type: object
      properties:
        code:
          type: string
        valid:
          type: boolean
        revoked:
