# Docker Engine 29+ enforces a minimum Docker API version of 1.40, while Testcontainers 1.x
# (docker-java) falls back to API 1.32 — the daemon rejects it with
# "client version 1.32 is too old. Minimum supported API version is 1.40".
# Pin an in-range API version (daemon range: 1.40–1.54). Remove this file when upgrading
# to Testcontainers 2.x, which negotiates the API version with the daemon.
api.version=1.44
