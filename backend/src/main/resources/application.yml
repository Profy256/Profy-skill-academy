spring:
  application:
    name: profy-skill-academy-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/profy}
    username: ${DATABASE_USERNAME:profy}
    password: ${DATABASE_PASSWORD:profy}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      max-lifetime: 3600000
      idle-timeout: 900000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379/0}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

profy:
  jwt-secret: ${JWT_SECRET:dev-only-insecure-secret-change-me}

  # ── AI Provider ──────────────────────────────────────────────
  # Works with ANY OpenAI-compatible API. Set the env vars:
  #   OpenRouter:  AI_BASE_URL=https://openrouter.ai/api/v1
  #   OpenAI:      AI_BASE_URL=https://api.openai.com/v1
  #   Gemini:      AI_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai
  #   Groq:        AI_BASE_URL=https://api.groq.com/openai/v1
  #   Together:    AI_BASE_URL=https://api.together.xyz/v1
  #   Any custom:  AI_BASE_URL=https://your-provider.com/v1
  # OpenRouter models: openrouter/free = auto-routes free models ($0);
  # openrouter/auto = paid Auto Router (needs credits, else 402).
  ai-base-url: ${AI_BASE_URL:https://openrouter.ai/api/v1}
  ai-api-key: ${AI_API_KEY:}
  ai-model: ${AI_MODEL:openrouter/free}
  ai-free-msgs-per-day: ${AI_FREE_MSGS_PER_DAY:20}
  ai-premium-msgs-per-day: ${AI_PREMIUM_MSGS_PER_DAY:200}

  # ── Stripe (International payments) ──────────────────────────
  stripe-secret-key: ${STRIPE_SECRET_KEY:}
  stripe-webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

  # ── MarzPay (Local mobile money: UG/KE) ─────────────────────
  # Sign up: https://wallet.wearemarz.com
  # Auth: HTTP Basic (base64 of "api_key:api_secret")
  marzpay-base-url: ${MARZPAY_BASE_URL:https://wallet.wearemarz.com/api/v1}
  marzpay-api-key: ${MARZPAY_API_KEY:}
  marzpay-api-secret: ${MARZPAY_API_SECRET:}
  marzpay-callback-url: ${MARZPAY_CALLBACK_URL:}

  # ── Mobile (RevenueCat for iOS/Android) ──────────────────────
  revenuecat-webhook-auth: ${REVENUECAT_WEBHOOK_AUTH:}

  # ── CampusLibrary ──────────────────────────────────────────
  campus-library-base-url: ${CAMPUS_LIBRARY_BASE_URL:https://campuslibrary.xyz}
  campus-library-api-key: ${CAMPUS_LIBRARY_API_KEY:}

  # ── AI Encryption (for DB-stored API keys) ─────────────────
  ai-encryption-key: ${PROFY_AI_ENCRYPTION_KEY:}

  # ── Email (Resend) — certificate + notification delivery ─────
  # Leave empty in dev: emails are logged and skipped, nothing breaks.
  resend-api-key: ${RESEND_API_KEY:}
  resend-from: "${RESEND_FROM:Dera Skul <onboarding@resend.dev>}"

  # ── Other ────────────────────────────────────────────────────
  site-url: ${SITE_URL:https://deraskul.com}
  youtube-api-key: ${YOUTUBE_API_KEY:}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  web-origin: ${WEB_ORIGIN:}
  admin-origin: ${ADMIN_ORIGIN:}
