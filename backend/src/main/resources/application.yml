spring:
  application:
    name: profy-skill-academy-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/profy}
    username: ${DATABASE_USERNAME:profy}
    password: ${DATABASE_PASSWORD:profy}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      max-lifetime: 3600000
      idle-timeout: 900000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379/0}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

profy:
  jwt-secret: ${JWT_SECRET:dev-only-insecure-secret-change-me}
  ai-base-url: ${AI_BASE_URL:https://openrouter.ai/api/v1}
  ai-api-key: ${AI_API_KEY:}
  ai-model: ${AI_MODEL:openai/gpt-4o-mini}
  ai-free-msgs-per-day: ${AI_FREE_MSGS_PER_DAY:20}
  ai-premium-msgs-per-day: ${AI_PREMIUM_MSGS_PER_DAY:200}
  stripe-secret-key: ${STRIPE_SECRET_KEY:}
  stripe-webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  revenuecat-webhook-auth: ${REVENUECAT_WEBHOOK_AUTH:}
  web-origin: ${WEB_ORIGIN:}
  admin-origin: ${ADMIN_ORIGIN:}
